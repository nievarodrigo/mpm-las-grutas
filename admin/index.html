<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f3c" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel | MPM Alquileres</title>
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-body">
    <section id="login-view" class="admin-login">
      <form class="admin-login__card" id="login-form">
        <img src="/public/logo-mpm.svg" alt="MPM" class="admin-login__logo" />
        <h1>Panel privado</h1>
        <p class="admin-login__hint">Ingresá la contraseña para ver las consultas y las visitas del sitio.</p>
        <label>
          <span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="button button--dark button--block" type="submit">Ingresar</button>
        <p class="form-feedback" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section id="dashboard-view" class="admin-dashboard" hidden>
      <header class="admin-header">
        <div class="admin-header__brand">
          <img src="/public/logo-mpm.svg" alt="MPM" />
          <span>Panel de administración</span>
        </div>
        <div class="admin-header__actions">
          <div class="admin-period" role="group" aria-label="Período">
            <button class="admin-period__chip is-active" data-period="today" type="button">Hoy</button>
            <button class="admin-period__chip" data-period="7d" type="button">7 días</button>
            <button class="admin-period__chip" data-period="30d" type="button">30 días</button>
          </div>
          <button class="button button--small" id="logout-button" type="button">Cerrar sesión</button>
        </div>
      </header>

      <main class="admin-main">
        <section class="admin-kpis" aria-label="Resumen del período">
          <article class="admin-kpi">
            <span class="admin-kpi__label">Visitas</span>
            <strong class="admin-kpi__value" data-kpi="pageviews">—</strong>
          </article>
          <article class="admin-kpi">
            <span class="admin-kpi__label">Visitantes únicos</span>
            <strong class="admin-kpi__value" data-kpi="visitors">—</strong>
          </article>
          <article class="admin-kpi">
            <span class="admin-kpi__label">Consultas nuevas</span>
            <strong class="admin-kpi__value" data-kpi="leadsNew">—</strong>
          </article>
          <article class="admin-kpi">
            <span class="admin-kpi__label">Consultas totales</span>
            <strong class="admin-kpi__value" data-kpi="leadsTotal">—</strong>
          </article>
        </section>

        <section class="admin-card admin-sources" aria-label="Origen de las visitas">
          <div class="admin-card__head">
            <h2>De dónde viene la gente</h2>
            <p class="admin-card__note">Estimado según el origen detectado — no es un dato exacto.</p>
          </div>
          <div id="sources-list" class="admin-sources__list">
            <p class="admin-empty">Cargando…</p>
          </div>
        </section>

        <section class="admin-card admin-leads" aria-label="Consultas recibidas">
          <div class="admin-card__head">
            <h2>Consultas</h2>
            <div class="admin-filters" role="group" aria-label="Filtrar consultas">
              <button class="admin-period__chip is-active" data-filter="todos" type="button">Todos</button>
              <button class="admin-period__chip" data-filter="nuevo" type="button">Nuevos</button>
              <button class="admin-period__chip" data-filter="contactado" type="button">Contactados</button>
            </div>
          </div>
          <div id="leads-list" class="admin-leads__list">
            <p class="admin-empty">Cargando…</p>
          </div>
        </section>
      </main>
    </section>

    <script src="/admin/auth.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
